name: Refresh dependency lockfile

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/refresh-dependency-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Update all dependencies to latest releases
        run: pnpm update --latest
      - name: Align TypeScript and ESLint to latest compatible majors
        run: pnpm add --save-dev "eslint@^9" "typescript@^6"
      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Compile CoffeeScript sources
        run: pnpm coffee:build
      - name: Lint entire project
        continue-on-error: true
        run: pnpm lint
      - name: Build production application
        run: pnpm build
      - name: Commit verified dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): update and verify latest stack"
            git push origin main
          fi
