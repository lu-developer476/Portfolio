<svg
  width="360"
  height="248"
  viewBox="0 0 360 248"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Fondo degradado -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>
  </defs>

  <rect width="360" height="248" fill="url(#bgGradient)" />

  <!-- Figura trasera (contorno) -->
  <rect
    x="130"
    y="74"
    width="90"
    height="90"
    rx="8"
    transform="rotate(45 175 119)"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="10"
  />

  <!-- Figura frontal (rellena) -->
  <rect
    x="155"
    y="74"
    width="90"
    height="90"
    rx="8"
    transform="rotate(45 200 119)"
    fill="#FFFFFF"
  />
</svg>
