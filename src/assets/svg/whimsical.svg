<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="256"
  height="256"
  viewBox="0 0 256 256"
  fill="none"
>
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#E879F9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="256" height="256" fill="url(#bgGradient)"/>

  <!-- rombo trasero -->
  <g filter="url(#shadow)">
    <rect
      x="68"
      y="84"
      width="64"
      height="64"
      rx="6"
      transform="rotate(45 100 116)"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="10"
      stroke-linejoin="round"
    />

    <!-- rombo delantero -->
    <rect
      x="102"
      y="84"
      width="64"
      height="64"
      rx="6"
      transform="rotate(45 134 116)"
      fill="#FFFFFF"
    />
  </g>
</svg>
