<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="0">
      <stop offset="0%" stop-color="#3B4DFF"/>
      <stop offset="100%" stop-color="#F270D8"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Back card -->
  <g transform="translate(192 256) rotate(-45 0 0)" filter="url(#shadow)">
    <rect x="-76" y="-76" width="152" height="152" rx="12"
          fill="none" stroke="#FFFFFF" stroke-width="22"/>
  </g>

  <!-- Front card -->
  <g transform="translate(278 256) rotate(-45 0 0)" filter="url(#shadow)">
    <rect x="-76" y="-76" width="152" height="152" rx="12"
          fill="#FFFFFF"/>
  </g>

</svg>
