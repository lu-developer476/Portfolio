<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" aria-label="Whimsical inspired icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3F46FF"/>
      <stop offset="100%" stop-color="#E76BDA"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="256" height="256" fill="url(#bg)"/>

  <!-- Back outlined card -->
  <g transform="translate(95 128) rotate(-45)" filter="url(#shadow)">
    <rect
      x="-23" y="-23"
      width="62" height="62"
      rx="4"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="9"
      stroke-linejoin="round"/>
  </g>

  <!-- Front filled card -->
  <g transform="translate(132 128) rotate(-45)" filter="url(#shadow)">
    <rect
      x="-28" y="-28"
      width="66" height="66"
      rx="5"
      fill="#FFFFFF"/>
  </g>
</svg>
